name: LastFM Bluesky Bot

on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:

env:
  CACHE_BREAKER: v2

jobs:
  run-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
  with:
    node-version: 20

      - run: npm install

      - run: node index.js
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}

      - name: Commit updated track
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          if [ -f lasttrack.txt ]; then
            git add lasttrack.txt
            git commit -m "Update last played track" || exit 0
            git push
          fi
# activate scheduler
# scheduler refresh 2
